name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read
  packages: read

jobs:
  iec61850:
    name: IEC 61850 interop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: "off"
      LIBIEC61850_IMAGE: ghcr.io/otfabric/iec61850-interop-libiec61850@sha256:dbace896592c139991ec07c9975830e170499ccabb5fc172ec2f92f992f73714
      IEC61850BEAN_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850bean@sha256:2b7c328c77155027447253fc04e9b854ae21349793185084fa6cf3824964db90
      DSCSYSTEMS_IMAGE: ghcr.io/otfabric/iec61850-interop-dscsystems@sha256:be96477983b4105e6709af8a731a274f05e74e5d465dee1e5f3aec753688f73e
      IEC61850RUST_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850-rust@sha256:19a0cc7099e6c044b2823e4747bd4c7f75fbe1a5f0e91779cb418517df9c99c5
      CBSIGMA_IMAGE: ghcr.io/otfabric/iec61850-interop-cbsigma@sha256:99f7dad5ea19bf6c69d9c5931bcc017bbe5b98ec8b18147083d06f964af2cd4a
      # The pinned images (iec61850-interop v1.6.1) implement the SV fixture;
      # dscsystems and libiec61850 also R-GOOSE/R-SV (contract 1.4, --transport udp).
      IEC61850_SV_FIXTURE: sv-v1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run interop matrix
        run: make interop

      # The TestLibIEC* suites run once per stack with the same adapter
      # contract; steps a stack does not implement are skipped with the
      # adapter's reason.
      - name: Run IEC 61850 interop against dscsystems
        env:
          IEC61850_PEER_STACK: dscsystems
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      - name: Run IEC 61850 interop against iec61850-rust
        env:
          IEC61850_PEER_STACK: iec61850-rust
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      - name: Run IEC 61850 interop against cbsigma
        env:
          IEC61850_PEER_STACK: cbsigma
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      # GOOSE is raw Ethernet: the adapters run on a Docker bridge network
      # whose bridge device goose0 the test opens from the host (as root,
      # for CAP_NET_RAW). An idle container gives the bridge its carrier.
      - name: Run GOOSE and SV interop
        env:
          GOOSE_IFACE: goose0
        run: |
          docker pull -q "$LIBIEC61850_IMAGE"
          docker pull -q "$DSCSYSTEMS_IMAGE"
          docker pull -q "$IEC61850RUST_IMAGE"
          docker pull -q "$CBSIGMA_IMAGE"
          docker network create -o com.docker.network.bridge.name=goose0 iec61850-interop-goose
          docker run -d --rm --name goose-carrier --network iec61850-interop-goose --entrypoint sleep "$LIBIEC61850_IMAGE" infinity
          sleep 2
          go test -exec 'sudo -E' -tags=interop -v -timeout 600s -run 'GOOSE|SV_' ./interop/...

      # R-GOOSE and R-SV (UDP, no raw Ethernet) against go-iec61850's own
      # adapter image, built by iec61850-interop's own-go-iec61850.yml from a
      # go-iec61850 release (here v1.19.4). It is not an independent
      # implementation (INTEROP.md): it finds wire changes against a released
      # go-iec61850, it is no interop evidence. IEC61850_PEER_STACK=otfabric
      # selects it alone; the steps above stay on the references.
      - name: Run R-GOOSE and R-SV interop against otfabric (own stack)
        env:
          IEC61850_PEER_STACK: otfabric
          IEC61850_INTEROP_OTFABRIC_IMAGE: ghcr.io/otfabric/iec61850-interop-otfabric@sha256:5ddd6b25118e21fba0b55c69d29fe79783a49e08b7a3a810b0ea100dd18adfd2
        run: |
          docker pull -q "$IEC61850_INTEROP_OTFABRIC_IMAGE"
          go test -tags=interop -v -count=1 -timeout 600s -run '^TestR(GOOSE|SV)_' ./interop/...

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-iec61850-interop-diagnostics
          path: artifacts/
          if-no-files-found: ignore
