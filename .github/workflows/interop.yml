name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read
  packages: read

jobs:
  iec61850:
    name: IEC 61850 interop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: "off"
      LIBIEC61850_IMAGE: ghcr.io/otfabric/iec61850-interop-libiec61850@sha256:62962e108b853c973722edd30da95b6e8beea685f117d0e7411423cff8bdc635
      IEC61850BEAN_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850bean@sha256:b1c1880637f53086707bfd59dc087d7ab40a7c2288da7a3210291d6d1066d8d3
      DSCSYSTEMS_IMAGE: ghcr.io/otfabric/iec61850-interop-dscsystems@sha256:3459f512165931544fa0139cb1519aade645e1636d4cf62ce0b28f5c44d3801a
      IEC61850RUST_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850-rust@sha256:a55f3f2ee8107519f0d3b1976869b5ffe74f3c9382f14459b2d0895a5c3cb8c7
      CBSIGMA_IMAGE: ghcr.io/otfabric/iec61850-interop-cbsigma@sha256:5cdbd552eb729fd79d6ffcddb986498061e7b769ccab4a9e46233dfaba24cde2
      # The pinned images (iec61850-interop v1.6.0) implement the SV fixture;
      # dscsystems and libiec61850 also R-GOOSE/R-SV (contract 1.4, --transport udp).
      IEC61850_SV_FIXTURE: sv-v1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run interop matrix
        run: make interop

      # The TestLibIEC* suites run once per stack with the same adapter
      # contract; steps a stack does not implement are skipped with the
      # adapter's reason.
      - name: Run IEC 61850 interop against dscsystems
        env:
          IEC61850_PEER_STACK: dscsystems
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      - name: Run IEC 61850 interop against iec61850-rust
        env:
          IEC61850_PEER_STACK: iec61850-rust
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      - name: Run IEC 61850 interop against cbsigma
        env:
          IEC61850_PEER_STACK: cbsigma
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      # GOOSE is raw Ethernet: the adapters run on a Docker bridge network
      # whose bridge device goose0 the test opens from the host (as root,
      # for CAP_NET_RAW). An idle container gives the bridge its carrier.
      - name: Run GOOSE and SV interop
        env:
          GOOSE_IFACE: goose0
        run: |
          docker pull -q "$LIBIEC61850_IMAGE"
          docker pull -q "$DSCSYSTEMS_IMAGE"
          docker pull -q "$IEC61850RUST_IMAGE"
          docker pull -q "$CBSIGMA_IMAGE"
          docker network create -o com.docker.network.bridge.name=goose0 iec61850-interop-goose
          docker run -d --rm --name goose-carrier --network iec61850-interop-goose --entrypoint sleep "$LIBIEC61850_IMAGE" infinity
          sleep 2
          go test -exec 'sudo -E' -tags=interop -v -timeout 600s -run 'GOOSE|SV_' ./interop/...

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-iec61850-interop-diagnostics
          path: artifacts/
          if-no-files-found: ignore
