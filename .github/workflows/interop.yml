name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read
  packages: read

jobs:
  iec61850:
    name: IEC 61850 interop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: "off"
      LIBIEC61850_IMAGE: ghcr.io/otfabric/iec61850-interop-libiec61850@sha256:601374067bd387a654d2e483f4dcba7511e20393d3a82b4e53670520e2cfca42
      IEC61850BEAN_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850bean@sha256:4008c73b3edf68ac025607c8041d02317887d4c4e5260445f3ee23f24b6c5279
      DSCSYSTEMS_IMAGE: ghcr.io/otfabric/iec61850-interop-dscsystems@sha256:eea55bc78ab59490f555f63786a2cb44f93d2d337d7b3537843ba6d74fa6e811
      IEC61850RUST_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850-rust@sha256:6a276e126b96f9782d5073c6d44c43cb1e2713c80468eeb1ad6054802fb15c1a
      CBSIGMA_IMAGE: ghcr.io/otfabric/iec61850-interop-cbsigma@sha256:7baf32ba5fed96840f925f3d75cfbda2380133c01a803502fa5bfddccd8a5201
      # The pinned images (iec61850-interop v1.5.0) implement the SV fixture;
      # dscsystems also R-GOOSE/R-SV (contract 1.4, --transport udp).
      IEC61850_SV_FIXTURE: sv-v1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run interop matrix
        run: make interop

      # The TestLibIEC* suites run once per stack with the same adapter
      # contract; steps a stack does not implement are skipped with the
      # adapter's reason.
      - name: Run IEC 61850 interop against dscsystems
        env:
          IEC61850_PEER_STACK: dscsystems
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      - name: Run IEC 61850 interop against iec61850-rust
        env:
          IEC61850_PEER_STACK: iec61850-rust
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      - name: Run IEC 61850 interop against cbsigma
        env:
          IEC61850_PEER_STACK: cbsigma
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      # GOOSE is raw Ethernet: the adapters run on a Docker bridge network
      # whose bridge device goose0 the test opens from the host (as root,
      # for CAP_NET_RAW). An idle container gives the bridge its carrier.
      - name: Run GOOSE and SV interop
        env:
          GOOSE_IFACE: goose0
        run: |
          docker pull -q "$LIBIEC61850_IMAGE"
          docker pull -q "$DSCSYSTEMS_IMAGE"
          docker pull -q "$IEC61850RUST_IMAGE"
          docker pull -q "$CBSIGMA_IMAGE"
          docker network create -o com.docker.network.bridge.name=goose0 iec61850-interop-goose
          docker run -d --rm --name goose-carrier --network iec61850-interop-goose --entrypoint sleep "$LIBIEC61850_IMAGE" infinity
          sleep 2
          go test -exec 'sudo -E' -tags=interop -v -timeout 600s -run 'GOOSE|SV_' ./interop/...

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-iec61850-interop-diagnostics
          path: artifacts/
          if-no-files-found: ignore
