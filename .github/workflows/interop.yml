name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  packages: read

jobs:
  iec61850:
    name: IEC 61850 interop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: "off"
      LIBIEC61850_IMAGE: ghcr.io/otfabric/iec61850-interop-libiec61850@sha256:be48749244ff3a019e0a61062134ed0fa69225b93e86fe50dde085ac2ee9b356
      IEC61850BEAN_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850bean@sha256:e8d3327eb783d10ebe9e34773368470d4f0ddda3abe8492bf787874e6e08e898
      DSCSYSTEMS_IMAGE: ghcr.io/otfabric/iec61850-interop-dscsystems@sha256:ea4b19da85ffcfb3fadd9ecd65cec3f5688763cdf950f0d16e5b239eb3b825f9
      IEC61850RUST_IMAGE: ghcr.io/otfabric/iec61850-interop-iec61850-rust@sha256:859fd8eced8cf57d97682b994994f85e125294341f302f307058575cf663e720
      # The pinned images (iec61850-interop v1.1.1) implement the SV fixture.
      IEC61850_SV_FIXTURE: sv-v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run interop matrix
        run: make interop

      # The TestLibIEC* suites run once per stack with the same adapter
      # contract; steps a stack does not implement are skipped with the
      # adapter's reason.
      - name: Run IEC 61850 interop against dscsystems
        env:
          IEC61850_PEER_STACK: dscsystems
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      - name: Run IEC 61850 interop against iec61850-rust
        env:
          IEC61850_PEER_STACK: iec61850-rust
        run: go test -tags=interop -v -timeout 900s -run '^Test(LibIEC|GoServer)' ./interop/...

      # GOOSE is raw Ethernet: the adapters run on a Docker bridge network
      # whose bridge device goose0 the test opens from the host (as root,
      # for CAP_NET_RAW). An idle container gives the bridge its carrier.
      - name: Run GOOSE and SV interop
        env:
          GOOSE_IFACE: goose0
        run: |
          docker pull -q "$LIBIEC61850_IMAGE"
          docker pull -q "$DSCSYSTEMS_IMAGE"
          docker pull -q "$IEC61850RUST_IMAGE"
          docker network create -o com.docker.network.bridge.name=goose0 iec61850-interop-goose
          docker run -d --rm --name goose-carrier --network iec61850-interop-goose --entrypoint sleep "$LIBIEC61850_IMAGE" infinity
          sleep 2
          go test -exec 'sudo -E' -tags=interop -v -timeout 600s -run 'GOOSE|SV_' ./interop/...

      - name: Collect Docker diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-iec61850-interop-diagnostics
          path: artifacts/
          if-no-files-found: ignore
