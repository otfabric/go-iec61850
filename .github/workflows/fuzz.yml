# SPDX-License-Identifier: MIT
#
# Scheduled fuzzing workflow.
#
# Runs nightly to explore new inputs beyond the committed seed corpus.
# Each target gets 5 minutes of fuzzing. Failures create a new issue or
# notify via the CI failure; the failing corpus entry is uploaded as an
# artifact for local reproduction.
#
# Manually triggerable via workflow_dispatch for on-demand deeper runs.

name: fuzz

on:
  schedule:
    # 02:00 UTC nightly
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzz duration per target (e.g. 5m, 30m, 2h)"
        required: false
        default: "5m"

jobs:
  # Targets are discovered, never listed, so a new Fuzz function runs without a
  # workflow change.
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: List Fuzz targets
        id: list
        run: |
          set -euo pipefail
          mod=$(go list -m)
          targets=$(for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              jq -cn --arg pkg ".${pkg#"$mod"}" --arg target "$target" '{pkg: $pkg, target: $target}'
            done
          done | jq -cs .)
          if [ "$targets" = "[]" ]; then
            echo "::error::no Fuzz targets found"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.pkg }} ${{ matrix.target }}
        env:
          FUZZ_TIME: ${{ github.event.inputs.fuzztime || '5m' }}
          FUZZ_PKG: ${{ matrix.pkg }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          FUZZ_SECS=$(echo "${FUZZ_TIME}" | sed 's/h/*3600/;s/m/*60/;s/s//' | bc)
          TIMEOUT_SECS=$((FUZZ_SECS + 120))
          go test -run='^$' \
            -fuzz="^${FUZZ_TARGET}\$" \
            -fuzztime="${FUZZ_TIME}" \
            -timeout="${TIMEOUT_SECS}s" \
            "${FUZZ_PKG}"

      - name: Upload failing corpus entry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
