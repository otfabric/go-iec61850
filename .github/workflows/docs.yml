# Documents against the code (DOC-008, standards/documentation.md#doc-sync)
# and otfabric-policy. pr.yml calls it on every pull request; on main it
# runs on every push, with no path filter.
name: Docs
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs (library)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.6.0
    with:
      docsync-version: v0.3.1
      # The repository's only otfabric-policy run (ci.yml turns go-ci's off).
      policy-version: v1.5.0
    secrets: inherit

  docs-sclparse:
    name: Docs (scl/cmd/sclparse)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.6.0
    with:
      module-dir: scl/cmd/sclparse
      docsync-version: v0.3.1
      policy-version: v1.5.0
      run-policy: false
    secrets: inherit

  docs-sclgen:
    name: Docs (scl/cmd/sclgen)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.6.0
    with:
      module-dir: scl/cmd/sclgen
      docsync-version: v0.3.1
      policy-version: v1.5.0
      run-policy: false
    secrets: inherit
