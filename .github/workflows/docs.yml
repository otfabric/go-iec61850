# Documents against the code (DOC-008, standards/documentation.md#doc-sync).
# No path filter: this is the check that runs when ci.yml skips a
# Markdown-only change, so branch protection can require it.
name: Docs
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Docs (library)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.5.0
    with:
      docsync-version: v0.3.0
      # No policy.yml in this repository: the Policy job runs here, so
      # Markdown-only changes (skipped by ci.yml) are still checked.
      policy-version: v1.4.1
    secrets: inherit

  docs-sclparse:
    name: Docs (scl/cmd/sclparse)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.5.0
    with:
      module-dir: scl/cmd/sclparse
      docsync-version: v0.3.0
      policy-version: v1.4.1
      run-policy: false
    secrets: inherit

  docs-sclgen:
    name: Docs (scl/cmd/sclgen)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.5.0
    with:
      module-dir: scl/cmd/sclgen
      docsync-version: v0.3.0
      policy-version: v1.4.1
      run-policy: false
    secrets: inherit
