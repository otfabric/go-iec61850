name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.1.1
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: go-iec61850
      go-versions: '["1.25", "1.26"]'
    secrets: inherit

  # The tools are nested modules (ADR-0009): the root run does not reach them.
  sclparse:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.1.1
    with:
      module-dir: scl/cmd/sclparse
      test-exclude-regex: "/example(s)?($|/)"
      run-govulncheck: true
      coverage-min: "90"
      run-codecov: false
      go-versions: '["1.25", "1.26"]'
    secrets: inherit

  # sclgen has no tests of its own; this keeps tidy, vet, lint and the matrix
  # build on it.
  sclgen:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.1.1
    with:
      module-dir: scl/cmd/sclgen
      test-exclude-regex: "/example(s)?($|/)"
      run-govulncheck: true
      run-codecov: false
      go-versions: '["1.25", "1.26"]'
    secrets: inherit

  # Per-package coverage gate. Test binaries run as root so the GOOSE
  # AF_PACKET transport tests exercise the real raw socket on lo.
  coverage-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build examples
        run: go build ./examples/...

      - name: Test with coverage (raw sockets as root)
        run: go test -exec sudo -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce per-package coverage (>= 90%)
        run: go run scripts/covergate.go -min 90 coverage.out

  # The committed SCL bindings must equal what sclgen produces from the XSD schemas.
  generated:
    name: Generated code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated SCL code
        run: make scl-check-generate
