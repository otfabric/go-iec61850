name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2
    with:
      codecov-name: go-iec61850
      go-versions: '["1.24", "1.25", "1.26"]'
    secrets: inherit

  # Per-package coverage gate. Test binaries run as root so the GOOSE
  # AF_PACKET transport tests exercise the real raw socket on lo.
  coverage-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage (raw sockets as root)
        run: go test -exec sudo -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce per-package coverage (>= 90%)
        run: go run scripts/covergate.go -min 90 coverage.out
