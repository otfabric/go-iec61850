# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run CI on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: go-iec61850
      go-versions: '["1.26", "1.27"]'
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      # The shared default (v2.1.6) predates Go 1.26; the version `make lint` is checked with.
      golangci-lint-version: v2.15.0
    secrets: inherit

  # The tools are nested modules (ADR-0009): the root run does not reach them.
  sclparse:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      module-dir: scl/cmd/sclparse
      test-exclude-regex: "/example(s)?($|/)"
      run-govulncheck: true
      coverage-min: "90"
      run-codecov: false
      go-versions: '["1.26", "1.27"]'
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      # The shared default (v2.1.6) predates Go 1.26; the version `make lint` is checked with.
      golangci-lint-version: v2.15.0
    secrets: inherit

  # sclgen has no tests of its own; this keeps tidy, vet, lint and the matrix
  # build on it.
  sclgen:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      module-dir: scl/cmd/sclgen
      test-exclude-regex: "/example(s)?($|/)"
      run-govulncheck: true
      run-codecov: false
      go-versions: '["1.26", "1.27"]'
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      # The shared default (v2.1.6) predates Go 1.26; the version `make lint` is checked with.
      golangci-lint-version: v2.15.0
    secrets: inherit

  # Per-package coverage gate. Test binaries run as root so the GOOSE
  # AF_PACKET transport tests exercise the real raw socket on lo.
  coverage-pkg-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build examples
        run: go build ./examples/...

      - name: Per-package coverage gate (raw sockets as root)
        run: make coverage-pkg-check COVER_FLAGS="-exec sudo -race"

  # The committed SCL bindings must equal what sclgen produces from the XSD schemas.
  generated:
    name: Generated code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated SCL code
        run: make scl-check-generate
