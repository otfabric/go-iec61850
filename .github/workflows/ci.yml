name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v1
    with:
      codecov-name: go-iec61850
      go-versions: '["1.24", "1.25", "1.26"]'
      primary-go-version: "1.24"
    secrets: inherit
